name: Build administrative navigation catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/geodata/admin/**'
      - 'tools/export_navigation.py'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate catalog
        run: python tools/export_navigation.py
      - name: Commit generated catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/data/admin_navigation.json
          if ! git diff --cached --quiet; then
            git commit -m "build(nav): refresh Godot administrative catalog"
            git push origin HEAD:main
          fi
